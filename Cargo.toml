[workspace]
members = [".", "gui"]

[package]
name = "bifrost"
version = "0.1.0"
edition = "2021"
description = "Lift already-decrypted Nintendo Switch executables toward native Windows programs"

[[bin]]
name = "bifrost"
path = "src/main.rs"

[dependencies]
capstone = "0.12"
lz4_flex = "0.11"
sha2 = "0.10"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
