[package]
name = "bifrost-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop front end for the Bifrost recompiler"

[[bin]]
name = "bifrost-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bifrost = { path = ".." }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
