name: Release
# Builds the Windows executables (bifrost.exe CLI + bifrost-gui.exe desktop app). Pushing a v* tag publishes them as a
# GitHub Release; pull requests and manual runs upload them as a workflow artifact.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fsr-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      - name: Build Windows FSR layer binaries
        run: scripts/build_fsr_layer.sh --windows-only
      - uses: actions/upload-artifact@v4
        with:
          name: fsr-layer-binaries
          path: |
            target/fsr-layer/x86
            target/fsr-layer/x64
  windows:
    needs: fsr-layer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: fsr-layer-binaries
          path: fsr-layer
      - run: cargo build --release --workspace --locked
      - name: Smoke test
        run: target/release/bifrost.exe --help
      - name: Package
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $d = "Bifrost-Windows-$v"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/bifrost.exe, target/release/bifrost-gui.exe, README.md $d
          New-Item -ItemType Directory "$d/fsr-layer/x86", "$d/fsr-layer/x64" -Force | Out-Null
          Copy-Item fsr-layer/x86/bifrost_fsr.dll, fsr-layer/x86/bifrost_fsr.json "$d/fsr-layer/x86"
          Copy-Item fsr-layer/x64/bifrost_fsr.dll, fsr-layer/x64/bifrost_fsr.json "$d/fsr-layer/x64"
          Compress-Archive -Path $d -DestinationPath "$d.zip"
          "PKG=$d" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: bifrost-windows
          path: ${{ env.PKG }}.zip
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android release signing
        env:
          BIFROST_ANDROID_KEYSTORE_B64: ${{ secrets.BIFROST_ANDROID_KEYSTORE_B64 }}
        run: |
          if [[ -n "$BIFROST_ANDROID_KEYSTORE_B64" ]]; then
            printf '%s' "$BIFROST_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bifrost-release.jks"
            echo "BIFROST_ANDROID_KEYSTORE=$RUNNER_TEMP/bifrost-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::BIFROST_ANDROID_KEYSTORE_B64 is not configured; APK will be signed with a temporary debug key."
          fi
      - name: Build and package Android APK
        env:
          BIFROST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BIFROST_ANDROID_KEYSTORE_PASSWORD }}
          BIFROST_ANDROID_KEY_ALIAS: ${{ secrets.BIFROST_ANDROID_KEY_ALIAS }}
          BIFROST_ANDROID_KEY_PASSWORD: ${{ secrets.BIFROST_ANDROID_KEY_PASSWORD }}
        run: |
          cd BifrostAndroid
          ./gradlew --no-daemon :app:assembleRelease
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA:0:7}"; fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Bifrost-Android-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: bifrost-android
          path: Bifrost-Android-*.apk
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-android
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Bifrost-Windows-*.zip
            dist/Bifrost-Android-*.apk
          generate_release_notes: true
