name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu qemu-user mingw-w64 \
            glslang-tools libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers vulkan-tools \
            spirv-tools xvfb imagemagick
          pip install unicorn==2.1.4 capstone==5.0.7
      - name: Build FSR Vulkan layer
        run: scripts/build_fsr_layer.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build
      - name: Differential test vs Unicorn
        run: python3 tests/diff/diff.py --count 1500 --seed 7
      - name: End-to-end (native + MinGW build)
        run: tests/e2e/run.sh
      - name: Modernizer end-to-end
        run: tests/e2e/modernize.sh
      - name: FSR Vulkan layer end-to-end
        run: tests/e2e/fsr_layer.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
  windows-renderer:
    runs-on: ubuntu-24.04
    env:
      BIFROST_WINDOWS_DEPS: ${{ github.workspace }}/.bifrost/windows-deps
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: .bifrost/windows-deps/out
          key: ${{ runner.os }}-windows-renderer-${{ hashFiles('scripts/build_windows_deps.sh') }}
      - name: Install cross-build and Wine tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build mingw-w64 \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            gcc-aarch64-linux-gnu \
            python3 git curl wine64 xvfb mesa-vulkan-drivers
      - name: Build Windows renderer dependencies
        run: scripts/build_windows_deps.sh
      - name: Windows NVN renderer end-to-end
        run: tests/e2e/windows_renderer.sh
  android-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install zstd
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
      - name: Prepare Winlator sources
        run: python3 BifrostAndroid/scripts/prepare_winlator.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-35" "ndk;24.0.8215888" "cmake;3.22.1"
      - name: Test and build Android launcher
        run: |
          cd BifrostAndroid
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
