name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu qemu-user mingw-w64
          pip install unicorn==2.1.4 capstone==5.0.7
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build
      - name: Differential test vs Unicorn
        run: python3 tests/diff/diff.py --count 1500 --seed 7
      - name: End-to-end (native + MinGW build)
        run: tests/e2e/run.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
